# Lints and builds the app, and checks the plugin scripts parse, on every PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Check plugin scripts
        run: for f in plugin/skills/*/scripts/*.mjs; do node --check "$f"; done
